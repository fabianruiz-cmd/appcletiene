<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CL TIENE — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #07090f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { width: 100%; max-width: 440px; text-align: center; }

    .logo-wrap { margin-bottom: 32px; }
    .logo-wrap img { height: 72px; object-fit: contain; }

    .cats {
      display: flex; justify-content: center; gap: 24px;
      margin-bottom: 36px; flex-wrap: wrap;
    }
    .cat { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #5a6580; font-weight: 500; }
    .cat-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; background: #111318; border: 1px solid #1e2535; }

    h1 { font-size: 26px; font-weight: 800; color: #e8eaf2; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #5a6580; line-height: 1.6; margin-bottom: 32px; }

    .card {
      background: #111318;
      border: 1px solid #1e2535;
      border-radius: 20px;
      padding: 32px 28px;
      text-align: left;
    }

    .card-title { font-size: 16px; font-weight: 700; color: #e8eaf2; margin-bottom: 4px; }
    .card-sub { font-size: 13px; color: #5a6580; margin-bottom: 20px; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #7080a0; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .field input {
      width: 100%; border: 1.5px solid #1e2535; border-radius: 12px;
      padding: 13px 16px; font-size: 15px; font-family: 'Inter', sans-serif;
      color: #e8eaf2; background: #0e1117; outline: none; transition: border-color .15s;
    }
    .field input:focus { border-color: #0d7a5f; }
    .field input::placeholder { color: #2a3550; }

    .btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px;
      cursor: pointer; transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #0d7a5f; color: #fff; margin-top: 4px;
    }
    .btn:hover { background: #0a6650; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .alert { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; display: none; }
    .alert.show { display: block; }
    .alert-err { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #f87171; }

    .loader { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      h1 { font-size: 22px; }
      .card { padding: 24px 18px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <img src="https://cltiene.com/wp-content/uploads/2026/01/e0280ba2b169453b2ae09ecf07c2b8d01673e12b.png"
         alt="CL TIENE"
         onerror="this.outerHTML='<div style=\'font-size:26px;font-weight:800;color:#e8eaf2\'>CL<span style=\'color:#0d7a5f\'>TIENE</span></div>'"/>
  </div>

  <div class="cats">
    <div class="cat"><div class="cat-icon">👥</div>Manada</div>
    <div class="cat"><div class="cat-icon">⭐</div>Premium</div>
    <div class="cat"><div class="cat-icon">🐾</div>Mascotas</div>
    <div class="cat"><div class="cat-icon">💗</div>Salud</div>
    <div class="cat"><div class="cat-icon">🚗</div>Movilidad</div>
  </div>

  <h1>Bienvenido a CL Tiene</h1>
  <p class="subtitle">Consulta tus servicios activos ingresando tu número de cédula.</p>

  <div class="card">
    <p class="card-title">Ingresa tu documento</p>
    <p class="card-sub">Te mostraremos solo tus servicios registrados.</p>
    <div class="alert alert-err" id="err"></div>
    <div class="field">
      <label>Número de Cédula</label>
      <input type="text" id="inp-doc" placeholder="Ej. 1000988807" maxlength="15"
             onkeydown="if(event.key==='Enter') entrar()"/>
    </div>
    <button class="btn" id="btn-entrar" onclick="entrar()">
      Entrar al Panel →
    </button>
  </div>
</div>

<script>
async function entrar() {
  const doc = document.getElementById('inp-doc').value.trim();
  const err = document.getElementById('err');
  err.classList.remove('show');

  if (!doc) {
    err.textContent = 'Por favor ingresa tu número de cédula.';
    err.classList.add('show');
    return;
  }

  const btn = document.getElementById('btn-entrar');
  btn.innerHTML = '<span class="loader"></span> Verificando...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/auth/validate-document', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ documento: doc })
    });
    const data = await res.json();

    if (data.success) {
      // Guardar cédula en sessionStorage y redirigir
      sessionStorage.setItem('cedula', doc);
      sessionStorage.setItem('nombre', data.user?.nombre || '');
      window.location.href = '/';
    } else {
      err.textContent = data.message || 'Documento no encontrado en el sistema.';
      err.classList.add('show');
    }
  } catch(e) {
    err.textContent = 'Error de conexión. Intenta de nuevo.';
    err.classList.add('show');
  } finally {
    btn.innerHTML = 'Entrar al Panel →';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
