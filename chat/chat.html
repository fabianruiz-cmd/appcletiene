<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CL TIENE — Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --is-dark: 1;
    }
    body.light-mode {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f8fafc;
      --border: #dde1ea;
      --text: #1a202c;
      --muted: #64748b;
      --muted2: #8090b0;
      --incoming: #ffffff;
      --outgoing: #d1fae5;
    }
    body.light-mode .topbar { background: #fff; }
    body.light-mode .chats-panel { background: #fff; }
    body.light-mode .chat-item:hover { background: #f8fafc; }
    body.light-mode .msg-header { background: #fff; }
    body.light-mode .msg-input-bar { background: #fff; }
    body.light-mode .msg-input-bar textarea { background: #f8fafc; border-color: #dde1ea; color: #1a202c; }
    body.light-mode .chats-search input { background: #f8fafc; border-color: #dde1ea; color: #1a202c; }
    body.light-mode .msg-bubble.incoming { color: #1a202c; }
    body.light-mode .msg-bubble.outgoing { color: #065f46; }
    body.light-mode .btn-icon { background: #f8fafc; border-color: #dde1ea; color: #64748b; }

    :root {
      --bg: #0a0d12;
      --surface: #111520;
      --surface2: #161c28;
      --border: #1e2535;
      --primary: #0d7a5f;
      --primary-light: rgba(13,122,95,.15);
      --wa: #25d366;
      --text: #e8eaf2;
      --muted: #5a6580;
      --muted2: #8090b0;
      --incoming: #1a2235;
      --outgoing: #0d4a39;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── Topbar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-logo { font-size: 16px; font-weight: 600; color: var(--text); }
    .topbar-logo span { color: var(--primary); }
    .topbar-badge {
      background: var(--wa); color: #fff;
      font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
      letter-spacing: .5px;
    }
    .topbar-right { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all .15s;
    }
    .btn-icon:hover { color: var(--text); border-color: var(--primary); }
    #btn-refresh.spinning { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout {
      display: flex; flex: 1; overflow: hidden;
    }

    /* ── Lista de chats ── */
    .chats-panel {
      width: 320px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      background: var(--surface);
    }
    .chats-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .chats-search input {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      outline: none;
    }
    .chats-search input:focus { border-color: var(--primary); }
    .chats-search input::placeholder { color: var(--muted); }
    .chats-list {
      flex: 1; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .chat-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
      position: relative;
    }
    .chat-item:hover { background: var(--surface2); }
    .chat-item.active { background: var(--primary-light); border-left: 3px solid var(--primary); }
    .chat-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0; overflow: hidden;
      font-weight: 600; color: var(--primary);
    }
    .chat-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-preview { font-size: 12px; color: var(--muted2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .chat-time { font-size: 11px; color: var(--muted); }
    .chat-unread {
      background: var(--wa); color: #fff;
      font-size: 11px; font-weight: 700;
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .chats-empty { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── Panel de mensajes ── */
    .messages-panel {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .msg-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .msg-header-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600; color: var(--primary); overflow: hidden;
    }
    .msg-header-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .msg-header-info { flex: 1; }
    .msg-header-name { font-size: 14px; font-weight: 600; }
    .msg-header-phone { font-size: 12px; color: var(--muted2); font-family: 'DM Mono', monospace; }
    .msg-header-actions { display: flex; gap: 8px; }

    .msg-list {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 4px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }

    /* Mensajes */
    .msg-bubble {
      max-width: 65%; padding: 8px 12px;
      border-radius: 12px; font-size: 13px; line-height: 1.5;
      position: relative;
    }
    .msg-bubble.incoming {
      background: var(--incoming); color: var(--text);
      border-radius: 4px 12px 12px 12px;
      align-self: flex-start;
    }
    .msg-bubble.outgoing {
      background: var(--outgoing); color: var(--text);
      border-radius: 12px 4px 12px 12px;
      align-self: flex-end;
    }
    .msg-time {
      font-size: 10px; color: var(--muted);
      margin-top: 3px; text-align: right;
      font-family: 'DM Mono', monospace;
    }
    .msg-date-divider {
      text-align: center; font-size: 11px; color: var(--muted);
      padding: 8px 0; font-family: 'DM Mono', monospace;
    }

    /* Input enviar */
    .msg-input-bar {
      padding: 12px 20px; background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end;
      flex-shrink: 0;
    }
    .msg-input-bar textarea {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 14px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
      resize: none; outline: none; max-height: 120px; min-height: 42px;
      line-height: 1.5; transition: border-color .15s;
    }
    .msg-input-bar textarea:focus { border-color: var(--primary); }
    .msg-input-bar textarea::placeholder { color: var(--muted); }
    .btn-send {
      width: 42px; height: 42px; border-radius: 10px;
      background: var(--primary); border: none; color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: background .15s; flex-shrink: 0;
    }
    .btn-send:hover { background: #0a6650; }
    .btn-send:disabled { opacity: .4; cursor: not-allowed; }

    /* Estado vacío */
    .no-chat {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      color: var(--muted);
    }
    .no-chat-icon { font-size: 64px; opacity: .3; }
    .no-chat p { font-size: 14px; }

    /* Loader */
    .loader { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; margin: 24px auto; }

    /* Responsive móvil */
    @media (max-width: 600px) {
      .chats-panel { width: 100%; }
      .messages-panel { display: none; }
      .messages-panel.active { display: flex; }
      .chats-panel.hidden { display: none; }
      .msg-header-back { display: flex !important; }
    }
    .msg-header-back {
      display: none; width: 32px; height: 32px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted2); cursor: pointer; align-items: center; justify-content: center;
      font-size: 18px;
    }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <img id="chat-logo"
         src="https://cltiene.com/wp-content/uploads/2026/01/e0280ba2b169453b2ae09ecf07c2b8d01673e12b.png"
         alt="CL TIENE" style="height:36px;object-fit:contain;"
         onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block'"/>
    <div id="logo-fallback" style="display:none;font-size:16px;font-weight:700;color:#e8eaf2">CL<span style="color:#0d7a5f">TIENE</span></div>
    <span class="topbar-badge">WhatsApp</span>
  </div>
  <div class="topbar-right">
    <div class="btn-icon" id="btn-refresh" onclick="loadChats()" title="Actualizar">↻</div>
    <div class="btn-icon" id="btn-modo" onclick="toggleModo()" title="Modo claro/oscuro">🌙</div>
  </div>
</div>

<div class="layout">

  <!-- Panel chats -->
  <div class="chats-panel" id="chats-panel">
    <div class="chats-search">
      <input type="text" id="search-input" placeholder="Buscar contacto..." oninput="filterChats()"/>
    </div>
    <div class="chats-list" id="chats-list">
      <div class="loader"></div>
    </div>
  </div>

  <!-- Panel mensajes -->
  <div class="messages-panel" id="messages-panel">
    <div class="no-chat" id="no-chat">
      <div class="no-chat-icon">💬</div>
      <p>Selecciona un chat para ver los mensajes</p>
    </div>
    <div id="chat-view" style="display:none;flex-direction:column;height:100%">
      <!-- Header -->
      <div class="msg-header">
        <button class="msg-header-back" id="btn-back" onclick="backToChats()">‹</button>
        <div class="msg-header-avatar" id="chat-avatar">?</div>
        <div class="msg-header-info">
          <div class="msg-header-name" id="chat-name">—</div>
          <div class="msg-header-phone" id="chat-phone">—</div>
        </div>
        <div class="msg-header-actions">
          <div class="btn-icon" onclick="loadMessages(currentChatId)" title="Actualizar mensajes">↻</div>
        </div>
      </div>
      <!-- Mensajes -->
      <div class="msg-list" id="msg-list"></div>
      <!-- Input -->
      <div class="msg-input-bar">
        <textarea id="msg-input" placeholder="Escribe un mensaje..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
          oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="btn-send" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

</div>

<script>
const WA_URL   = '/wa-proxy';  // Proxy en el servidor para evitar CORS
const WA_TOKEN = 'WwW3UAz2x6iJ0nasEd7ar5WFoVsxnGpc';

let allChats = [];
let currentChatId = null;
let currentChatName = '';

// ── Cargar chats ──────────────────────────────────────────────────────────────
async function loadChats() {
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('spinning');
  const list = document.getElementById('chats-list');
  list.innerHTML = '<div class="loader"></div>';

  try {
    const res = await fetch('/api/chats');
    const data = await res.json();
    allChats = data.chats || [];
    renderChats(allChats);
  } catch(e) {
    list.innerHTML = '<div class="chats-empty">Error al cargar chats.<br/>Verifica la conexión.</div>';
  } finally {
    btn.classList.remove('spinning');
  }
}

function renderChats(chats) {
  const list = document.getElementById('chats-list');
  if (!chats.length) {
    list.innerHTML = '<div class="chats-empty">No hay chats disponibles</div>';
    return;
  }
  list.innerHTML = chats.map(function(c) {
    const name = c.name || formatPhone(c.id);
    const initial = name.charAt(0).toUpperCase();
    const preview = c.last_message?.text?.body || c.last_message?.caption || '📎 Adjunto';
    const time = c.last_message?.timestamp ? formatTime(c.last_message.timestamp) : '';
    const unread = c.unread_count > 0 ? '<div class="chat-unread">' + c.unread_count + '</div>' : '';
    const active = c.id === currentChatId ? ' active' : '';
    return '<div class="chat-item' + active + '" onclick="openChat(\'' + c.id + '\',\'' + escapeQuote(name) + '\')">'
      + '<div class="chat-avatar">' + initial + '</div>'
      + '<div class="chat-info">'
        + '<div class="chat-name">' + escapeHtml(name) + '</div>'
        + '<div class="chat-preview">' + escapeHtml(preview.toString().slice(0,50)) + '</div>'
      + '</div>'
      + '<div class="chat-meta"><div class="chat-time">' + time + '</div>' + unread + '</div>'
      + '</div>';
  }).join('');
}

function filterChats() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = allChats.filter(function(c) {
    return (c.name || c.id).toLowerCase().includes(q);
  });
  renderChats(filtered);
}

// ── Abrir chat ────────────────────────────────────────────────────────────────
async function openChat(chatId, name) {
  currentChatId = chatId;
  currentChatName = name;
  document.getElementById('chat-name').textContent = name;
  document.getElementById('chat-phone').textContent = formatPhone(chatId);
  document.getElementById('chat-avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('no-chat').style.display = 'none';
  const view = document.getElementById('chat-view');
  view.style.display = 'flex';

  // Móvil
  document.getElementById('chats-panel').classList.add('hidden');
  document.getElementById('messages-panel').classList.add('active');

  // Actualizar activo
  renderChats(allChats);
  await loadMessages(chatId);
}

function backToChats() {
  document.getElementById('chats-panel').classList.remove('hidden');
  document.getElementById('messages-panel').classList.remove('active');
}

// ── Cargar mensajes ───────────────────────────────────────────────────────────
async function loadMessages(chatId) {
  const list = document.getElementById('msg-list');
  list.innerHTML = '<div class="loader"></div>';
  try {
    const res = await fetch('/api/messages/' + encodeURIComponent(chatId));
    const data = await res.json();
    const messages = data.messages || [];
    renderMessages(messages);
  } catch(e) {
    list.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted)">Error al cargar mensajes</div>';
  }
}

function renderMessages(messages) {
  const list = document.getElementById('msg-list');
  if (!messages.length) {
    list.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted)">Sin mensajes</div>';
    return;
  }
  let lastDate = '';
  list.innerHTML = messages.map(function(m) {
    const isOut = m.from_me;
    const text = m.text?.body || m.caption || (m.type !== 'text' ? '📎 ' + m.type : '');
    const ts = m.timestamp ? new Date(m.timestamp * 1000) : new Date();
    const dateStr = ts.toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
    const timeStr = ts.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
    let divider = '';
    if (dateStr !== lastDate) {
      divider = '<div class="msg-date-divider">' + dateStr + '</div>';
      lastDate = dateStr;
    }
    return divider
      + '<div class="msg-bubble ' + (isOut ? 'outgoing' : 'incoming') + '">'
      + escapeHtml(text)
      + '<div class="msg-time">' + timeStr + '</div>'
      + '</div>';
  }).join('');
  list.scrollTop = list.scrollHeight;
}

// ── Enviar mensaje ────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentChatId) return;

  const btn = document.getElementById('btn-send');
  btn.disabled = true;
  input.disabled = true;

  try {
    const res = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to: currentChatId, message: text })
    });
    const data = await res.json();
    if (data.ok) {
      input.value = '';
      input.style.height = 'auto';
      await loadMessages(currentChatId);
    } else {
      alert('Error al enviar: ' + (data.error || 'intenta de nuevo'));
    }
  } catch(e) {
    alert('Error de conexión');
  } finally {
    btn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function formatPhone(id) {
  return '+' + (id || '').replace('@s.whatsapp.net','').replace('@g.us','');
}
function formatTime(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
  }
  return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short' });
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeQuote(s) {
  return String(s).replace(/'/g,"\\'");
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Modo claro/oscuro ────────────────────────────────────────────────────────
const LOGO_OSCURO = 'https://cltiene.com/wp-content/uploads/2026/01/e0280ba2b169453b2ae09ecf07c2b8d01673e12b.png';
const LOGO_CLARO  = 'https://cltiene.com/wp-content/uploads/2025/10/logo-CL.png';

function toggleModo() {
  const isLight = document.body.classList.toggle('light-mode');
  const btn = document.getElementById('btn-modo');
  btn.textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('chat-modo', isLight ? 'light' : 'dark');
  const img = document.getElementById('chat-logo');
  if (img) img.src = isLight ? LOGO_CLARO : LOGO_OSCURO;
}

// Aplicar modo guardado
(function() {
  const modo = localStorage.getItem('chat-modo');
  if (modo === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('btn-modo').textContent = '☀️';
    const img = document.getElementById('chat-logo');
    if (img) img.src = LOGO_CLARO;
  }
})();

// Cargar al inicio
loadChats();
// Auto-actualizar cada 30s
setInterval(loadChats, 30000);
</script>
</body>
</html>
